# ohmygoat custom model/provider config
#
# Command Code (commandcode.ai) provider, catalogued over its OpenAI-compatible wire.
# Base: https://api.commandcode.ai/provider/v1  ·  auth: x-api-key or Authorization: Bearer.
#
# Set COMMANDCODE_API_KEY in the environment to enable this provider.
# Command Code is available on demand; no default model role points at it.
#
# Only /chat/completions ids are listed here (api: openai-completions).
# Costs come from the shared catalog merge; Command Code bills credits, not $/token,
# and runs hourly off-peak pricing, so no static cost block is pinned here.
providers:
  commandcode:
    baseUrl: https://api.commandcode.ai/provider/v1
    api: openai-completions
    apiKey: COMMANDCODE_API_KEY # env-var name; set it in the environment, never commit the value
    models:
      - id: "gpt-5.6-sol"
        name: "GPT-5.6 Sol (Command Code)"
        contextWindow: 1050000
        input: [text, image]
      - id: "gpt-5.6-luna"
        name: "GPT-5.6 Luna (Command Code)"
        contextWindow: 1050000
        reasoning: true
        compat:
          supportsReasoningEffort: true
        input: [text, image]
