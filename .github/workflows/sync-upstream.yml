name: OhMyGoat Upstream Sync

# Merges can1357/oh-my-pi main into this fork on a schedule and opens (or
# updates) one reviewable PR. Never merges, never resolves downstream conflicts
# automatically, and NEVER executes code from the merge candidate: no Bun is
# installed on this job and no repo scripts run. All actions pinned to SHAs.

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write # push to automation/upstream-sync only
  pull-requests: write # open/update the sync PR
  issues: write # open the conflict issue
  actions: write # dispatch OhMyGoat CI on the sync branch (section 8.5)

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/can1357/oh-my-pi.git
  SYNC_BRANCH: automation/upstream-sync
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream main
          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "compare=https://github.com/can1357/oh-my-pi/commit/${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          git checkout -B "$SYNC_BRANCH" origin/main
          if git merge --no-ff -m "chore: sync can1357/oh-my-pi main ($UPSTREAM_SHA)" upstream/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "conflict_paths=" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tr '\n' ' ' > "$RUNNER_TEMP/conflicts"
            echo "conflict_paths=$(cat "$RUNNER_TEMP/conflicts")" >> "$GITHUB_OUTPUT"
            git merge --abort || true
          fi

      # Trust boundary (plan section 8.3): downstream-owned workflows must
      # survive the merge byte-for-byte as they exist on origin/main, upstream
      # may only touch the three inherited (disabled) workflows, and any NEW
      # workflow file from upstream blocks the sync outright.
      - name: Workflow import guard
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          DOWNSTREAM=".github/workflows/ohmg-ci.yml .github/workflows/release-ohmg.yml .github/workflows/sync-upstream.yml"
          ALLOWED=".github/workflows/ci.yml .github/workflows/bazel-cache-warm.yml .github/workflows/nix.yml"
          git checkout origin/main -- $DOWNSTREAM
          git diff --quiet origin/main -- $DOWNSTREAM
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: restore downstream-owned workflows after upstream merge"
          fi
          for f in $(git diff --name-only origin/main..HEAD -- .github/workflows); do
            ok=false
            for a in $ALLOWED; do [ "$f" = "$a" ] && ok=true; done
            for d in $DOWNSTREAM; do [ "$f" = "$d" ] && ok=true; done
            if [ "$ok" != true ]; then
              echo "::error::Refusing to sync: upstream touched a non-allowlisted workflow ($f)"
              exit 1
            fi
          done
          NEW="$(git diff --name-only --diff-filter=A origin/main..HEAD -- .github/workflows || true)"
          for f in $NEW; do
            ok=false
            for a in $ALLOWED; do [ "$f" = "$a" ] && ok=true; done
            if [ "$ok" != true ]; then
              echo "::error::Refusing to sync: upstream added a new workflow ($f)"
              exit 1
            fi
          done

      - name: Open or update conflict issue
        if: always() && steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.merge.outputs.upstream_sha }}"
          PATHS="${{ steps.merge.outputs.conflict_paths }}"
          BODY="Upstream sync of \`can1357/oh-my-pi@${SHA}\` into \`$SYNC_BRANCH\` hit merge conflicts and was aborted; nothing was pushed.

          Unresolved paths:
          $(echo "$PATHS" | tr ' ' '\n' | sed '/^$/d;s/^/- \`/;s/$/\`/')

          Downstream-owned regions (brand, presets, updater, installers, native lock, site) are never auto-resolved. Resolve manually (e.g. merge the upstream SHA on a branch) or rebase the offending downstream change before the next run.

          Upstream commit: ${{ steps.merge.outputs.compare }}"
          EXISTING="$(gh issue list --label upstream-conflict --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
            gh issue comment "$EXISTING" --body "Re-reported for upstream commit \`${SHA}\`."
          else
            gh issue create --title "Upstream sync conflict" --body "$BODY"
          fi
          # Same label-lookup race class as the PR path: label tolerantly, never abort.
          CONFLICT_ISSUE="${EXISTING:-$(gh issue list --title "Upstream sync conflict" --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)}"
          [ -n "$CONFLICT_ISSUE" ] && gh issue edit "$CONFLICT_ISSUE" --add-label upstream-conflict \
            || echo "::warning::could not add upstream-conflict label"
          echo "::error::upstream sync conflicts with $SHA"
          exit 1

      - name: Push sync branch
        if: steps.merge.outputs.merged == 'true'
        env:
          GIT_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$(git log origin/main..HEAD --oneline)" ]; then
            echo "no upstream changes to sync (merge was a no-op)"
            echo "nothing_to_push=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git push --force-with-lease "https://x-access-token:${GIT_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Open or update sync PR
        if: steps.merge.outputs.merged == 'true' && env.nothing_to_push != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.merge.outputs.upstream_sha }}"
          BODY="Automated upstream sync of \`can1357/oh-my-pi@${SHA}\`.

          - Upstream commit: ${{ steps.merge.outputs.compare }}
          - Produced by \`.github/workflows/sync-upstream.yml\`; never auto-merges.
          - \`OhMyGoat CI / verify\` is dispatched explicitly (GITHUB_TOKEN events do not trigger \`pull_request\` runs).

          Downstream-owned paths (brand/TUI, packaging presets, updater, installers, native lock, site) may need conflict-aware review."
          EXISTING="$(gh pr list --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number // empty' || true)"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore: sync can1357/oh-my-pi main" --body "$BODY"
          else
            gh pr create --base main --head "$SYNC_BRANCH" --title "chore: sync can1357/oh-my-pi main" --body "$BODY"
          fi
          # Label assignment must never abort the sync: a lookup race against a
          # freshly created label has returned "not found" and failed the step.
          gh pr edit "$SYNC_BRANCH" --add-label upstream-sync \
            || echo "::warning::could not add upstream-sync label to the sync PR"

      - name: Dispatch OhMyGoat CI on the sync branch
        if: steps.merge.outputs.merged == 'true' && env.nothing_to_push != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ohmg-ci.yml --ref "$SYNC_BRANCH"
