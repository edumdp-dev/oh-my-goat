name: OhMyGoat Release

# OhMyGoat binary release. Published assets:
#   ohmg-darwin-x64, ohmg-darwin-arm64, ohmg-linux-x64, ohmg-linux-arm64,
#   ohmg-windows-x64.exe, ohmg-windows-arm64.exe, install.sh, install.ps1,
#   ohmygoat.config.yml, ohmygoat.models.yml, SHA256SUMS.txt, LICENSE,
#   THIRD-PARTY-NOTICES.txt.
#
# All actions are pinned to full commit SHAs. Build jobs run with the workflow
# default `contents: read`; only the publish job (protected environment
# `ohmg-release`) receives write privileges. No npm / Homebrew / Mise / Apple
# credentials are used at any point.

"on":
  push:
    tags:
      - "ohmg-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing ohmg-v* tag to build and publish"
        required: true
        type: string
        default: "ohmg-v0.0.2"

permissions:
  contents: read

concurrency:
  group: "release-ohmg-${{ github.ref }}"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve tag and cross-check PRODUCT_VERSION
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            push) TAG="${GITHUB_REF_NAME}" ;;
            *) TAG="${{ inputs.tag }}" ;;
          esac
          case "$TAG" in
            ohmg-v*) ;;
            *) echo "refusing to release: $TAG is not an ohmg-v* tag" >&2; exit 1 ;;
          esac
          VERSION="${TAG#ohmg-v}"
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to release: $VERSION is not a plain semver version" >&2; exit 1 ;;
          esac
          # Read PRODUCT_VERSION straight from the identity source.
          PRODUCT=$(gh api "repos/${{ github.repository }}/contents/packages/utils/src/dirs.ts?ref=${TAG}" \
            --jq '.content' | base64 -d \
            | sed -n 's/^export const PRODUCT_VERSION[^"]*"\([^"]*\)".*/\1/p' | head -n1)
          if [ "$PRODUCT" != "$VERSION" ]; then
            echo "tag $TAG declares $VERSION but PRODUCT_VERSION is $PRODUCT" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing $TAG (PRODUCT_VERSION $VERSION)"

  # Builds the six release binaries on the exact hosted runner matrix. Each job
  # is read-only; nothing is published from here.
  build:
    name: "Build ohmg (${{ matrix.target_id }})"
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target_id: linux-x64, os: ubuntu-24.04, native_tags: linux-x64, binary: ohmg-linux-x64 }
          - { target_id: linux-arm64, os: ubuntu-24.04-arm, native_tags: linux-arm64, binary: ohmg-linux-arm64 }
          - { target_id: darwin-x64, os: macos-15-intel, native_tags: darwin-x64, binary: ohmg-darwin-x64 }
          - { target_id: darwin-arm64, os: macos-14, native_tags: darwin-arm64, binary: ohmg-darwin-arm64 }
          - { target_id: win32-x64, os: windows-2022, native_tags: win32-x64, binary: ohmg-windows-x64.exe }
          - { target_id: win32-arm64, os: windows-11-arm, native_tags: win32-arm64, binary: ohmg-windows-arm64.exe }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stage locked native addon
        run: bun scripts/ohmg-fetch-natives.ts --tag ${{ matrix.native_tags }}
      - name: Build binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Smoke test (POSIX)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" \
            "./packages/coding-agent/binaries/${{ matrix.binary }}" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" \
            "./packages/coding-agent/binaries/${{ matrix.binary }}" --smoke-test
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "./packages/coding-agent/binaries/${{ matrix.binary }}"
          $runtimeDir = Join-Path $env:RUNNER_TEMP "ohmg-smoke"
          $env:HOME = Join-Path $runtimeDir "home"
          $env:USERPROFILE = $env:HOME
          $env:LOCALAPPDATA = Join-Path $runtimeDir "local"
          $env:XDG_DATA_HOME = Join-Path $runtimeDir "xdg"
          New-Item -ItemType Directory -Force -Path $env:HOME, $env:LOCALAPPDATA, $env:XDG_DATA_HOME | Out-Null
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ohmg-binary-${{ matrix.target_id }}
          path: packages/coding-agent/binaries/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1

  # Single publishing job: only this job holds write privileges, gated on the
  # `ohmg-release` environment.
  publish:
    name: Publish OhMyGoat release
    needs: [verify-tag, build]
    runs-on: ubuntu-24.04
    environment: ohmg-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ohmg-binary-*
          path: staging/binaries
          merge-multiple: true
      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p staging/out
          mv staging/binaries/ohmg-* staging/out/
          cp scripts/install.sh scripts/install.ps1 staging/out/
          cp packaging/ohmygoat.config.yml packaging/ohmygoat.models.yml staging/out/
          cp LICENSE THIRD-PARTY-NOTICES.txt staging/out/
          ls -la staging/out
          # Guard: all six binaries must be present.
          for a in ohmg-darwin-x64 ohmg-darwin-arm64 ohmg-linux-x64 ohmg-linux-arm64 ohmg-windows-x64.exe ohmg-windows-arm64.exe; do
            test -f "staging/out/$a" || { echo "missing asset $a" >&2; exit 1; }
          done
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd staging/out
          sha256sum ohmg-* install.sh install.ps1 ohmygoat.config.yml ohmygoat.models.yml LICENSE THIRD-PARTY-NOTICES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          cat > "$NOTES" <<EOF
          OhMyGoat v${VERSION} — first binary release.

          - Base: [can1357/oh-my-pi@v18.1.8](https://github.com/can1357/oh-my-pi) (MIT).
          - OhMyGoat delta: \`ohmg\` CLI, isolated \`.ohmg\` config dir, blue goat TUI identity,
            Dudu's portable model preset + CommandCode catalog (opt-in via \`COMMANDCODE_API_KEY\`),
            SnapCompact-first compaction, and automated upstream sync by reviewable PR.
          - Binaries: macOS (Intel + Apple Silicon) ad-hoc signed, **not notarized**;
            Windows x64/arm64 **unsigned** (no Authenticode). Gatekeeper/SmartScreen
            will warn — verify \`SHA256SUMS.txt\` and the attestations below.
          - No npm / Homebrew / Mise channels for OhMyGoat in this release.
          - Install: see README or https://ohmygoat.vercel.app

          Source: https://github.com/edumdp-dev/oh-my-goat/tree/${TAG}
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" || true
          else
            gh release create "$TAG" --title "OhMyGoat v${VERSION}" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" staging/out/* --clobber
      - name: Attest provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "staging/out/*"
