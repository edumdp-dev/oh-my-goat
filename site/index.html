    <title>OhMyGoat — your terminal agent, tuned for the herd</title>
    <script>(function(){try{var t=null;try{t=localStorage.getItem("ohmg:theme")}catch(e){}if(t!=="dark"&&t!=="light"){t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"}document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute("content",t==="light"?"#F4F8FF":"#04070E")}}catch(e){document.documentElement.setAttribute("data-theme","dark")}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
